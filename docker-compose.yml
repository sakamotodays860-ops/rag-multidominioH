# ---------------------------------------------------------------------------
# Servicios de la FASE 1: backend (FastAPI / Python 3.12) y PostgreSQL + pgvector.
# Los servicios de fases posteriores (Streamlit, worker de ingesta) se anadiran
# mas adelante.
# ---------------------------------------------------------------------------

name: rag-multidominio

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: rag-multidominio-backend:0.1.0
    container_name: rag_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://rag_user:cambiar_esta_clave@postgres:5432/rag_multidominio}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rag_network

  postgres:
    # Imagen oficial de PostgreSQL con la extension pgvector incluida.
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_multidominio}
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar_esta_clave}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Volumen nombrado para persistencia de datos entre reinicios.
      - pgdata:/var/lib/postgresql/data
      # Scripts de inicializacion (se activan en fases posteriores).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_user} -d ${POSTGRES_DB:-rag_multidominio}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rag_network

volumes:
  pgdata:
    name: rag_multidominio_pgdata

networks:
  rag_network:
    name: rag_network
    driver: bridge